TERMS.subnet_questions = [
{q:'IPv4 1: Ein Client hat 192.168.10.130/26. Bestimme Netzadresse, Broadcast, Hostbereich und Hostanzahl.',a:'Rechenweg:\n1) /26 bedeutet: 26 Netzbits und 6 Hostbits.\n2) Hostanzahl: 2^6 - 2 = 62 nutzbare Hosts.\n3) /26 entspricht 255.255.255.192. Im letzten Oktett ist die Blockgröße 256 - 192 = 64.\n4) Die Netze springen also in 64er-Schritten: .0, .64, .128, .192.\n5) Die Adresse .130 liegt im Block .128 bis .191.\n\nErgebnis:\nNetzadresse: 192.168.10.128\nErster Host: 192.168.10.129\nLetzter Host: 192.168.10.190\nBroadcast: 192.168.10.191\nNutzbare Hosts: 62',ex:'Diese Aufgabe ist gut gestellt, weil du nicht nur eine Zahl auswendig nennst, sondern den kompletten Rechenweg zeigen musst.',merke:'Bei Subnetting immer: Maske → Hostbits → Blockgröße → passender Block → Netz/Broadcast/Hosts.'},
{q:'IPv4 2: Für ein VLAN werden mindestens 50 Geräte benötigt. Welche kleinste CIDR-Maske reicht?',a:'Gesucht ist die kleinste passende Hostanzahl.\n\nDu brauchst mindestens 50 nutzbare Hostadressen.\nFormel: 2^Hostbits - 2 >= 50\n\n5 Hostbits: 2^5 - 2 = 30 → zu wenig\n6 Hostbits: 2^6 - 2 = 62 → reicht\n\nIPv4 hat 32 Bit. Wenn 6 Bits für Hosts bleiben, sind 32 - 6 = 26 Bits Netzanteil.\n\nErgebnis: /26 mit 255.255.255.192 und 62 nutzbaren Hosts.',ex:'IHK-Aufgaben fragen oft nicht direkt nach /26, sondern geben eine Geräteanzahl vor. Dann musst du rückwärts über die Hostbits rechnen.',merke:'Geräteanzahl → passende 2er-Potenz suchen → CIDR = 32 - Hostbits.'},
{q:'IPv4 3: Prüfe, ob 10.20.30.64/26 eine gültige Hostadresse ist.',a:'Nein, das ist keine gültige Hostadresse.\n\nRechenweg:\n/26 = 255.255.255.192\nBlockgröße = 256 - 192 = 64\nNetzsprünge: .0, .64, .128, .192\n\nDie Adresse 10.20.30.64 ist genau ein Netzsprung. Deshalb ist sie die Netzadresse des Subnetzes 10.20.30.64/26.\n\nHostbereich wäre 10.20.30.65 bis 10.20.30.126.\nBroadcast wäre 10.20.30.127.',ex:'Solche Aufgaben testen, ob du Netzadresse, Hostadresse und Broadcast unterscheiden kannst.',merke:'Die erste Adresse im Block ist Netzadresse, die letzte Broadcast. Beide nie an Hosts vergeben.'},
{q:'IPv4 4: Ein PC 192.168.5.70/27 soll mit Server 192.168.5.95/27 sprechen. Sind beide im gleichen Subnetz?',a:'Nein.\n\nRechenweg:\n/27 = 255.255.255.224\nBlockgröße = 256 - 224 = 32\nNetzblöcke im letzten Oktett: .0-.31, .32-.63, .64-.95, .96-.127 ...\n\n192.168.5.70 liegt im Netz 192.168.5.64/27.\n192.168.5.95 ist in diesem Block die Broadcastadresse, nicht die Hostadresse.\n\nDer Server hat also eine ungültige Hostadresse. Korrekt wären Hosts .65 bis .94.',ex:'Hier ist die Falle: Beide sehen auf den ersten Blick ähnlich aus, aber .95 ist Broadcast.',merke:'Bei /27 haben die Blöcke 32 Adressen: .64 bis .95, wobei .95 Broadcast ist.'},
{q:'IPv4 5: Teile 192.168.100.0/24 in vier gleich große Subnetze. Welche Netze entstehen?',a:'Ein /24 soll in 4 gleich große Subnetze geteilt werden.\n\n4 Subnetze = 2^2 → du brauchst 2 zusätzliche Netzbits.\n/24 + 2 = /26\n\n/26 hat Blockgröße 64.\n\nDie vier Subnetze sind:\n1) 192.168.100.0/26 → Hosts .1 bis .62, Broadcast .63\n2) 192.168.100.64/26 → Hosts .65 bis .126, Broadcast .127\n3) 192.168.100.128/26 → Hosts .129 bis .190, Broadcast .191\n4) 192.168.100.192/26 → Hosts .193 bis .254, Broadcast .255',ex:'Diese Aufgabe übt Subnetze bilden, nicht nur ein einzelnes Subnetz ausrechnen.',merke:'Mehr Subnetze bedeutet: Bits vom Hostanteil für den Netzanteil ausleihen.'},
{q:'IPv4 6: Warum braucht man bei Geräten in verschiedenen Subnetzen ein Standardgateway?',a:'Ein Gerät kann nur direkt mit Zielen im eigenen IP-Netz kommunizieren. Liegt die Ziel-IP außerhalb des eigenen Subnetzes, sendet der Client das Paket an sein Standardgateway. Das Gateway ist meistens ein Router oder Layer-3-Switch und leitet das Paket in andere Netze weiter.\n\nOhne korrektes Standardgateway funktioniert lokale Kommunikation noch, aber Ziele außerhalb des eigenen Netzes, z. B. Internet oder andere VLANs, sind nicht erreichbar.',ex:'Das ist eine typische Verständnisfrage: Subnetting bestimmt auch, wann Routing nötig wird.',merke:'Eigenes Netz = direkt. Fremdes Netz = über Gateway.'},
{q:'IPv6 1: Schreibe 2001:0db8:0000:0000:0000:ff00:0042:8329 korrekt gekürzt.',a:'Regeln:\n1) Führende Nullen in jedem Block dürfen weg.\n2) Eine zusammenhängende Folge von 0000-Blöcken darf einmal durch :: ersetzt werden.\n\nAusgeschrieben:\n2001:0db8:0000:0000:0000:ff00:0042:8329\n\nFührende Nullen entfernen:\n2001:db8:0:0:0:ff00:42:8329\n\nNullfolge kürzen:\n2001:db8::ff00:42:8329',ex:'Die wichtige Regel ist: :: darf nur einmal in einer IPv6-Adresse vorkommen.',merke:'Führende Nullen weg, längste Nullblockfolge mit genau einem :: ersetzen.'},
{q:'IPv6 2: Erkläre den Unterschied zwischen Link-Local, Unique Local und Global Unicast.',a:'Link-Local:\nBeginnt typischerweise mit fe80::/10. Diese Adresse gilt nur im lokalen Netzsegment und wird z. B. für Neighbor Discovery oder Router Advertisements genutzt. Sie wird nicht geroutet.\n\nUnique Local Address (ULA):\nMeist fc00::/7, praktisch häufig fd00::/8. Das ist ungefähr vergleichbar mit privaten IPv4-Adressen und für interne Netze gedacht.\n\nGlobal Unicast:\nÖffentlich routbare IPv6-Adresse, typischerweise aus 2000::/3. Damit kann ein Gerät grundsätzlich weltweit eindeutig adressierbar sein.',ex:'Diese Frage ist besser als „Wie lang ist IPv6?“, weil du echte Adresstypen unterscheiden musst.',merke:'fe80 = lokal am Link, fd = intern/privat ähnlich, 2000::/3 = öffentlich routbar.'},
{q:'IPv6 3: Warum gibt es bei IPv6 keinen Broadcast und was wird stattdessen genutzt?',a:'IPv6 verwendet keinen Broadcast. Der Grund: Broadcast belastet immer alle Geräte im lokalen Netz, auch wenn viele davon die Nachricht gar nicht brauchen.\n\nStattdessen nutzt IPv6 Multicast. Dabei werden nur Geräte angesprochen, die zu einer bestimmten Multicast-Gruppe gehören. Beispiele sind Neighbor Discovery oder Router Solicitation/Advertisement über ICMPv6.',ex:'IPv6 ersetzt mehrere IPv4-Mechanismen: ARP wird durch NDP ersetzt und Broadcast durch Multicast.',merke:'IPv6: kein Broadcast, stattdessen Multicast + ICMPv6/NDP.'},
{q:'IPv6 4: Was bedeutet /64 bei IPv6 und warum ist das im LAN so typisch?',a:'/64 bedeutet: Die ersten 64 Bit sind der Netzpräfix, die letzten 64 Bit sind die Interface-ID.\n\nDas ist im LAN typisch, weil viele IPv6-Mechanismen, besonders SLAAC, mit /64-Netzen arbeiten. Der Host kann sich dann mit Router Advertisements selbst eine Adresse bilden.\n\nWichtig: Bei IPv6 rechnet man im normalen LAN nicht wie bei IPv4 knapp mit Hostanzahlen. Ein /64 ist riesig und wird trotzdem standardmäßig für ein LAN verwendet.',ex:'Die Falle ist, IPv6 wie IPv4 knapp subnetten zu wollen. In IPv6 ist /64 im LAN der Normalfall.',merke:'IPv6-LAN fast immer /64: 64 Bit Netz, 64 Bit Interface-ID.'},
{q:'IPv6 5: Ein Client hat nur eine fe80::-Adresse. Was bedeutet das für die Erreichbarkeit?',a:'Eine fe80::-Adresse ist eine Link-Local-Adresse. Der Client kann damit im lokalen Netzsegment kommunizieren, z. B. mit dem Router oder Nachbarn auf demselben Link.\n\nEr ist damit aber nicht über Router hinweg erreichbar und hat keine globale IPv6-Erreichbarkeit. Wenn Internet per IPv6 funktionieren soll, braucht er zusätzlich eine Global-Unicast-Adresse oder passende IPv6-Konfiguration über Router Advertisement/DHCPv6.',ex:'Das ist wie APIPA bei IPv4 nicht exakt dasselbe, aber als Prüfungslogik ähnlich: Nur lokale Adresse reicht nicht für globale Kommunikation.',merke:'fe80 bleibt lokal. Für Internet brauchst du Global Unicast und Gateway/Router Advertisement.'},
{q:'IPv6 6: Welche Rolle hat NDP bei IPv6?',a:'NDP bedeutet Neighbor Discovery Protocol und läuft über ICMPv6. Es übernimmt mehrere Aufgaben, die bei IPv4 teilweise ARP oder andere Mechanismen erledigen.\n\nWichtige Aufgaben:\n- MAC-Adresse zu einer IPv6-Adresse im lokalen Netz finden\n- Router im lokalen Netz finden\n- prüfen, ob Nachbarn erreichbar sind\n- automatische Adresskonfiguration unterstützen\n\nDeshalb darf man ICMPv6 nicht einfach komplett blockieren, sonst funktionieren wichtige IPv6-Grundfunktionen nicht richtig.',ex:'IHK-Falle: ICMPv6 ist bei IPv6 nicht nur „Ping“, sondern zentral für den Betrieb.',merke:'IPv6 braucht ICMPv6/NDP für Grundfunktionen.'}
];

TERMS.wiso_questions = [
{q:'WISO 1: Besitz vs. Eigentum anhand eines Firmenlaptops erklären.',a:'Besitz bedeutet, dass jemand die tatsächliche Sachherrschaft über eine Sache hat. Eigentum bedeutet, dass jemand rechtlich Inhaber der Sache ist.\n\nBeispiel Firmenlaptop:\nDu nutzt den Laptop im Betrieb oder zu Hause. Damit bist du Besitzer, weil du das Gerät tatsächlich hast. Eigentümer bleibt aber das Unternehmen, weil es den Laptop gekauft hat und rechtlich darüber verfügen darf.\n\nPrüfungsantwort: Besitz = tatsächliches Haben, Eigentum = rechtliches Gehören.',merke:'Besitz = haben, Eigentum = gehören.'},
{q:'WISO 2: Ein Kunde reklamiert einen defekten Monitor nach 8 Monaten. Geht es um Garantie oder Gewährleistung?',a:'Zuerst geht es um die gesetzliche Gewährleistung, weil ein Mangel an einer Kaufsache vorliegt. Gewährleistung ist gesetzlich vorgeschrieben. Garantie ist dagegen freiwillig und hängt von den Garantiebedingungen des Herstellers oder Händlers ab.\n\nIn der Antwort solltest du klar schreiben: Der Kunde kann Gewährleistungsrechte geltend machen. Eine Garantie kann zusätzlich bestehen, muss aber nicht.',merke:'Gewährleistung = gesetzlich. Garantie = freiwillig.'},
{q:'WISO 3: Welche Rechte hat ein Käufer bei mangelhafter Ware?',a:'Typische Rechte bei Sachmängeln sind:\n1) Nacherfüllung: Reparatur oder Ersatzlieferung\n2) Rücktritt vom Vertrag, wenn Nacherfüllung scheitert oder unzumutbar ist\n3) Minderung des Kaufpreises\n4) eventuell Schadensersatz\n\nIn der Prüfung reicht oft: Zuerst Nacherfüllung verlangen, danach je nach Situation Rücktritt, Minderung oder Schadensersatz.',merke:'Bei Mängeln zuerst Nacherfüllung.'},
{q:'WISO 4: Unterschied Datenschutz und Datensicherheit mit Beispiel.',a:'Datenschutz schützt personenbezogene Daten, also Daten über identifizierte oder identifizierbare Personen. Beispiel: Kundennamen, Adressen, Personalnummern.\n\nDatensicherheit schützt Daten allgemein vor Verlust, Manipulation und unbefugtem Zugriff. Das betrifft personenbezogene und nicht personenbezogene Daten. Beispiel: Backups, Zugriffsschutz, Verschlüsselung, Firewall.\n\nKurz: Datenschutz fragt „Darf ich diese personenbezogenen Daten verarbeiten?“. Datensicherheit fragt „Wie schütze ich Daten technisch und organisatorisch?“',merke:'Datenschutz = personenbezogene Daten. Datensicherheit = Schutz aller Daten.'},
{q:'WISO 5: Nenne wichtige DSGVO-Grundsätze und erkläre zwei davon.',a:'Wichtige DSGVO-Grundsätze sind Rechtmäßigkeit, Transparenz, Zweckbindung, Datenminimierung, Richtigkeit, Speicherbegrenzung, Integrität/Vertraulichkeit und Rechenschaftspflicht.\n\nBeispiel Zweckbindung:\nDaten dürfen nur für den Zweck genutzt werden, für den sie erhoben wurden.\n\nBeispiel Datenminimierung:\nEs sollen nur Daten erhoben werden, die wirklich notwendig sind. Für einen Newsletter braucht man z. B. nicht zwingend das Geburtsdatum.',merke:'Nur notwendige Daten, klarer Zweck, sicher verarbeiten.'},
{q:'WISO 6: Was ist der Unterschied zwischen Fixkosten und variablen Kosten?',a:'Fixkosten bleiben unabhängig von der produzierten oder verkauften Menge gleich. Beispiele: Miete, Gehälter, Versicherungen.\n\nVariable Kosten ändern sich mit der Menge. Beispiele: Materialkosten, Verpackung, Versand pro Stück.\n\nGesamtkosten = Fixkosten + variable Kosten.\n\nPrüfungsbeispiel: Wenn mehr PCs produziert werden, steigen die Materialkosten, aber die Monatsmiete der Halle bleibt gleich.',merke:'Fix bleibt, variabel wächst mit Menge.'},
{q:'WISO 7: Minimalprinzip und Maximalprinzip unterscheiden.',a:'Minimalprinzip bedeutet: Ein festes Ziel soll mit möglichst geringem Mitteleinsatz erreicht werden.\nBeispiel: 20 Arbeitsplätze sollen mit möglichst niedrigen Kosten ausgestattet werden.\n\nMaximalprinzip bedeutet: Mit gegebenen Mitteln soll ein möglichst gutes Ergebnis erreicht werden.\nBeispiel: Mit 10.000 € Budget sollen möglichst viele leistungsfähige Arbeitsplätze beschafft werden.',merke:'Minimal = Ziel fest, Einsatz klein. Maximal = Einsatz fest, Ergebnis groß.'},
{q:'WISO 8: Was ist eine Nutzwertanalyse und wann ist sie sinnvoll?',a:'Eine Nutzwertanalyse ist ein Bewertungsverfahren, bei dem mehrere Alternativen anhand gewichteter Kriterien verglichen werden.\n\nVorgehen:\n1) Kriterien festlegen, z. B. Preis, Leistung, Support, Energieverbrauch\n2) Kriterien gewichten\n3) Alternativen bewerten\n4) Punkte mit Gewichtung multiplizieren\n5) Gesamtnutzwert vergleichen\n\nSie ist sinnvoll, wenn nicht nur der Preis zählt, sondern mehrere qualitative und quantitative Kriterien.',merke:'Nutzwertanalyse = Entscheidungen mit gewichteten Kriterien begründen.'},
{q:'WISO 9: Unterschied Angebot, Anfrage und Bestellung.',a:'Anfrage:\nDer Kunde fragt unverbindlich nach Informationen, z. B. Preis oder Lieferzeit.\n\nAngebot:\nDer Anbieter macht eine verbindliche Erklärung mit Ware, Menge, Preis und Bedingungen, sofern es nicht ausdrücklich freibleibend ist.\n\nBestellung:\nDer Kunde nimmt ein Angebot an oder gibt selbst ein Angebot zum Kauf ab. Ein Vertrag entsteht, wenn Angebot und Annahme übereinstimmen.',merke:'Kaufvertrag = Angebot + Annahme.'},
{q:'WISO 10: Rechte und Pflichten im Ausbildungsverhältnis nennen.',a:'Pflichten des Azubis:\n- Lernpflicht\n- Berufsschule besuchen\n- Berichtsheft führen\n- Weisungen befolgen\n- sorgsam mit Arbeitsmitteln umgehen\n- Verschwiegenheit beachten\n\nPflichten des Betriebs:\n- Ausbildung planmäßig durchführen\n- Ausbilder bereitstellen\n- Ausbildungsmittel kostenlos zur Verfügung stellen\n- Vergütung zahlen\n- für Berufsschule freistellen\n- Zeugnis ausstellen',merke:'Azubi muss lernen, Betrieb muss ausbilden.'},
{q:'WISO 11: Was bedeutet Break-even-Point?',a:'Der Break-even-Point ist der Punkt, an dem Erlöse und Kosten gleich hoch sind. Das Unternehmen macht dort weder Gewinn noch Verlust.\n\nUnterhalb des Break-even entsteht Verlust. Oberhalb entsteht Gewinn.\n\nFormelidee:\nBreak-even-Menge = Fixkosten / Deckungsbeitrag pro Stück\nDeckungsbeitrag = Verkaufspreis pro Stück - variable Kosten pro Stück',merke:'Break-even = Gewinnschwelle.'},
{q:'WISO 12: Unterschied Brutto und Netto bei Lohn und Rechnung.',a:'Beim Lohn bedeutet Brutto der Betrag vor Abzügen wie Steuern und Sozialversicherung. Netto ist das, was ausgezahlt wird.\n\nBei Rechnungen bedeutet Netto meist der Betrag ohne Umsatzsteuer. Brutto ist der Endbetrag inklusive Umsatzsteuer.\n\nPrüfungsantwort: Brutto enthält noch Abzüge bzw. Steuern, Netto ist der bereinigte Betrag.',merke:'Brutto ist mehr, Netto bleibt übrig bzw. ohne Steuer.'},
{q:'WISO 13: Welche Sozialversicherungen gibt es?',a:'Die fünf Zweige der Sozialversicherung sind:\n- Krankenversicherung\n- Pflegeversicherung\n- Rentenversicherung\n- Arbeitslosenversicherung\n- Unfallversicherung\n\nDie Beiträge werden meistens von Arbeitgeber und Arbeitnehmer gemeinsam getragen. Die gesetzliche Unfallversicherung zahlt der Arbeitgeber allein.',merke:'KRPAU: Kranken, Rente, Pflege, Arbeitslos, Unfall.'},
{q:'WISO 14: Was ist eine ordentliche und außerordentliche Kündigung?',a:'Ordentliche Kündigung:\nSie erfolgt unter Einhaltung einer Kündigungsfrist.\n\nAußerordentliche Kündigung:\nSie erfolgt meist fristlos und braucht einen wichtigen Grund, z. B. schwere Pflichtverletzung.\n\nIn der Ausbildung gelten zusätzliche Schutzregeln. Nach der Probezeit ist eine Kündigung durch den Betrieb nur unter engen Voraussetzungen möglich.',merke:'Ordentlich = mit Frist. Außerordentlich = wichtiger Grund.'},
{q:'WISO 15: Was macht ein Betriebsrat?',a:'Ein Betriebsrat vertritt die Interessen der Arbeitnehmer im Betrieb. Er hat je nach Thema Informations-, Anhörungs-, Beratungs- und Mitbestimmungsrechte.\n\nBeispiele:\n- Arbeitszeitregelungen\n- Urlaubsgrundsätze\n- Gesundheitsschutz\n- soziale Angelegenheiten\n- Anhörung bei Kündigungen\n\nEr ersetzt nicht die Geschäftsführung, sondern wirkt bei Arbeitnehmerinteressen mit.',merke:'Betriebsrat = Interessenvertretung der Beschäftigten.'}
];

TERMS.sql_questions = [
{q:'SQL 1: Kunden und Bestellungen stehen in zwei Tabellen. Welche Abfrage zeigt alle Kunden, auch wenn sie keine Bestellung haben?',a:'Du brauchst einen LEFT JOIN, wenn die Kundentabelle links steht.\n\nBeispiel:\nSELECT k.Name, b.BestellNr\nFROM Kunde k\nLEFT JOIN Bestellung b ON k.KundenID = b.KundenID;\n\nErklärung:\nAlle Kunden bleiben im Ergebnis. Hat ein Kunde keine Bestellung, stehen die Spalten aus Bestellung auf NULL.',merke:'Alle links behalten = LEFT JOIN.'},
{q:'SQL 2: Unterschied WHERE und HAVING erklären.',a:'WHERE filtert einzelne Zeilen vor der Gruppierung. HAVING filtert Gruppen nach GROUP BY.\n\nBeispiel WHERE:\nSELECT * FROM Kunde WHERE Ort = "München";\n\nBeispiel HAVING:\nSELECT KundenID, COUNT(*)\nFROM Bestellung\nGROUP BY KundenID\nHAVING COUNT(*) > 3;\n\nHAVING brauchst du, wenn du auf Aggregatfunktionen wie COUNT, SUM oder AVG filterst.',merke:'WHERE vor GROUP BY, HAVING nach GROUP BY.'},
{q:'SQL 3: Primärschlüssel und Fremdschlüssel an einem Beispiel erklären.',a:'Ein Primärschlüssel identifiziert jeden Datensatz eindeutig, z. B. KundenID in der Tabelle Kunde.\n\nEin Fremdschlüssel verweist auf den Primärschlüssel einer anderen Tabelle, z. B. KundenID in der Tabelle Bestellung.\n\nDadurch weiß die Datenbank, welche Bestellung zu welchem Kunden gehört. Außerdem schützt referenzielle Integrität davor, dass Bestellungen auf nicht vorhandene Kunden verweisen.',merke:'Primärschlüssel = eindeutig hier. Fremdschlüssel = Verweis dorthin.'},
{q:'SQL 4: Was ist der Unterschied zwischen INNER JOIN und LEFT JOIN?',a:'INNER JOIN zeigt nur Datensätze, bei denen beide Tabellen eine passende Beziehung haben.\n\nLEFT JOIN zeigt alle Datensätze der linken Tabelle und ergänzt passende Datensätze der rechten Tabelle. Fehlt rechts ein Treffer, steht dort NULL.\n\nBeispiel:\nINNER JOIN: nur Kunden mit Bestellung.\nLEFT JOIN: alle Kunden, auch Kunden ohne Bestellung.',merke:'INNER = Schnittmenge. LEFT = alles links plus Treffer rechts.'},
{q:'SQL 5: Welche Fehlerquelle gibt es bei SELECT *?',a:'SELECT * gibt alle Spalten zurück. Das ist bequem, aber oft schlecht, weil unnötige Daten übertragen werden, Spaltenreihenfolgen sich ändern können und sensible Daten versehentlich ausgegeben werden.\n\nBesser ist es, benötigte Spalten explizit zu nennen:\nSELECT Name, Ort FROM Kunde;',merke:'SELECT * nur zum schnellen Testen, nicht sauber für produktive Abfragen.'},
{q:'SQL 6: Was bedeutet Normalisierung und warum macht man sie?',a:'Normalisierung bedeutet, Daten sinnvoll auf mehrere Tabellen aufzuteilen, um Redundanzen und Änderungsfehler zu vermeiden.\n\nBeispiel:\nStatt Kundendaten in jeder Bestellung erneut zu speichern, gibt es eine Tabelle Kunde und eine Tabelle Bestellung mit Fremdschlüssel.\n\nVorteile:\n- weniger doppelte Daten\n- weniger Widersprüche\n- bessere Datenpflege\n- klare Beziehungen',merke:'Normalisierung reduziert doppelte Daten und Anomalien.'},
{q:'SQL 7: Was ist eine Transaktion und wozu dienen COMMIT und ROLLBACK?',a:'Eine Transaktion fasst mehrere Datenbankoperationen zu einer logischen Einheit zusammen. Entweder werden alle Schritte erfolgreich gespeichert oder keiner.\n\nCOMMIT speichert die Änderungen dauerhaft.\nROLLBACK macht Änderungen der Transaktion rückgängig.\n\nBeispiel Banküberweisung:\nGeld vom Konto A abbuchen und Konto B gutschreiben muss zusammen funktionieren. Wenn Schritt 2 scheitert, muss Schritt 1 zurückgenommen werden.',merke:'Transaktion = alles oder nichts.'},
{q:'SQL 8: Was machen COUNT, SUM und AVG?',a:'COUNT zählt Datensätze.\nSUM bildet eine Summe.\nAVG berechnet den Durchschnitt.\n\nBeispiel:\nSELECT COUNT(*) FROM Bestellung;\nSELECT SUM(Betrag) FROM Bestellung;\nSELECT AVG(Betrag) FROM Bestellung;\n\nMit GROUP BY kannst du diese Werte pro Gruppe berechnen, z. B. Umsatz pro Kunde.',merke:'COUNT zählt, SUM summiert, AVG mittelt.'}
];

TERMS.array_questions = [
{q:'Array 1: Ein Array hat 10 Elemente und beginnt bei Index 0. Welche Indizes sind gültig?',a:'Gültig sind die Indizes 0 bis 9.\n\nWarum?\nWenn ein Array 10 Elemente hat und bei 0 beginnt, ist der erste Index 0. Der letzte Index ist Länge - 1, also 10 - 1 = 9.\n\nIndex 10 wäre bereits außerhalb des Arrays und führt typischerweise zu einem Fehler.',merke:'Letzter Index = Länge - 1.'},
{q:'Array 2: Warum ist i <= array.length in einer Schleife oft falsch?',a:'Wenn ein Array bei 0 beginnt, sind die gültigen Indizes 0 bis length - 1.\n\nEine Schleife mit i <= array.length läuft auch noch bei i == array.length. Dieser Index existiert nicht mehr.\n\nRichtig ist meistens:\nfor (i = 0; i < array.length; i++)\n\nSo endet die Schleife beim letzten gültigen Index.',merke:'Bei 0-basierten Arrays fast immer i < length verwenden.'},
{q:'Array 3: Was ist der Unterschied zwischen Index und Wert?',a:'Der Index ist die Position im Array. Der Wert ist der Inhalt an dieser Position.\n\nBeispiel:\nnoten = [2, 1, 3]\nnoten[0] hat den Wert 2.\nIndex 0 ist also die Position, 2 ist der gespeicherte Wert.\n\nViele Fehler entstehen, wenn man Index und Wert verwechselt.',merke:'Index = wo? Wert = was steht dort?'},
{q:'Array 4: Wie findet man die größte Zahl in einem Array?',a:'Typisches Vorgehen:\n1) Setze max auf das erste Element.\n2) Gehe alle weiteren Elemente durch.\n3) Wenn ein Element größer als max ist, ersetze max.\n4) Am Ende enthält max den größten Wert.\n\nPseudocode:\nmax = zahlen[0]\nFÜR i VON 1 BIS länge(zahlen)-1\n  WENN zahlen[i] > max DANN\n    max = zahlen[i]\n  ENDE WENN\nENDE FÜR',merke:'Ersten Wert als Startwert nehmen, dann vergleichen.'},
{q:'Array 5: Wie berechnet man den Durchschnitt eines Zahlenarrays?',a:'Vorgehen:\n1) Summe mit 0 starten.\n2) Alle Werte addieren.\n3) Summe durch Anzahl der Elemente teilen.\n\nPseudocode:\nsumme = 0\nFÜR jedes element IN zahlen\n  summe = summe + element\nENDE FÜR\ndurchschnitt = summe / länge(zahlen)\n\nAchtung: Bei leerem Array darf man nicht durch 0 teilen.',merke:'Durchschnitt = Summe / Anzahl.'},
{q:'Array 6: Was ist ein mehrdimensionales Array?',a:'Ein mehrdimensionales Array ist ein Array mit mehreren Richtungen, z. B. Zeilen und Spalten. Man kann es sich wie eine Tabelle vorstellen.\n\nBeispiel:\nmatrix[zeile][spalte]\n\nTypische Anwendung:\n- Tabellen\n- Spielfelder\n- Stundenpläne\n- Pixelbilder\n\nWichtig: Du brauchst meist zwei Schleifen, eine für Zeilen und eine für Spalten.',merke:'2D-Array = Tabelle mit Zeilen und Spalten.'}
];

TERMS.ae_questions = [
{q:'AE 1: Compiler und Interpreter unterscheiden.',a:'Ein Compiler übersetzt den Quellcode vor der Ausführung in Maschinencode oder Bytecode. Dadurch werden viele Fehler früh erkannt und das Programm kann später schneller laufen.\n\nEin Interpreter führt Code zur Laufzeit aus, oft Schritt für Schritt. Das ist flexibel und gut zum Testen, kann aber langsamer sein.\n\nKurz:\nCompiler = vorher übersetzen.\nInterpreter = zur Laufzeit ausführen.',merke:'Compiler vorher, Interpreter währenddessen.'},
{q:'AE 2: Was ist das EVA-Prinzip?',a:'EVA steht für Eingabe, Verarbeitung, Ausgabe. Es beschreibt den Grundaufbau vieler Programme.\n\nEingabe:\nDaten kommen ins Programm, z. B. Benutzer gibt Preis und Menge ein.\n\nVerarbeitung:\nDas Programm berechnet oder prüft etwas, z. B. Gesamtpreis = Preis * Menge.\n\nAusgabe:\nDas Ergebnis wird angezeigt oder gespeichert.\n\nIn Pseudocode-Aufgaben hilft EVA, die Logik sauber zu strukturieren.',merke:'Eingabe → Verarbeitung → Ausgabe.'},
{q:'AE 3: Klasse, Objekt, Attribut und Methode erklären.',a:'Klasse:\nBauplan für Objekte, z. B. Klasse Auto.\n\nObjekt:\nKonkrete Instanz einer Klasse, z. B. auto1.\n\nAttribut:\nEigenschaft eines Objekts, z. B. farbe, kennzeichen, kilometerstand.\n\nMethode:\nFunktion/Verhalten eines Objekts, z. B. fahren(), bremsen(), tanken().\n\nPrüfungsbeispiel: Eine Klasse Kunde hat Attribute kundennummer und name sowie Methoden adresseAendern() oder bestellungAufgeben().',merke:'Klasse = Bauplan, Objekt = konkretes Ding.'},
{q:'AE 4: Blackbox-Test und Whitebox-Test unterscheiden.',a:'Blackbox-Test:\nDer Tester kennt den inneren Code nicht. Er prüft Eingaben und erwartete Ausgaben. Typisch sind Äquivalenzklassen und Grenzwerttests.\n\nWhitebox-Test:\nDer Tester kennt den Code und testet gezielt interne Strukturen wie Bedingungen, Schleifen und Zweige.\n\nKurz:\nBlackbox = von außen testen.\nWhitebox = mit Blick in den Code testen.',merke:'Blackbox außen, Whitebox innen.'},
{q:'AE 5: Was sind Äquivalenzklassen und Grenzwerttests?',a:'Äquivalenzklassen teilen Eingaben in Gruppen ein, die sich voraussichtlich gleich verhalten. Aus jeder Gruppe testet man einen Vertreter.\n\nGrenzwerttests prüfen Werte direkt an den Grenzen, weil dort besonders häufig Fehler entstehen.\n\nBeispiel Alter 18 bis 67 gültig:\nUngültig: 17\nGrenze gültig: 18\nMitte gültig: 40\nGrenze gültig: 67\nUngültig: 68',merke:'Grenzen testen: knapp darunter, genau drauf, knapp darüber.'},
{q:'AE 6: Was ist ein Container in der Programmierung?',a:'Ein Container ist eine Datenstruktur, die mehrere Werte verwaltet. Beispiele sind Array, Liste, Stack, Queue, Set oder Map.\n\nUnterschiede:\nArray: feste Reihenfolge, Zugriff über Index.\nListe: flexible Sammlung.\nStack: Last In, First Out.\nQueue: First In, First Out.\nMap/Dictionary: Schlüssel-Wert-Paare.\n\nIn Prüfungen sollst du oft entscheiden, welche Struktur für einen Fall sinnvoll ist.',merke:'Container speichern mehrere Werte organisiert.'},
{q:'AE 7: Unterschied Stack und Queue erklären.',a:'Stack:\nLIFO-Prinzip: Last In, First Out. Das zuletzt eingelegte Element kommt zuerst wieder heraus. Beispiel: Stapel Teller.\n\nQueue:\nFIFO-Prinzip: First In, First Out. Das zuerst eingelegte Element kommt zuerst wieder heraus. Beispiel: Warteschlange.\n\nTypische Operationen:\nStack: push/pop\nQueue: enqueue/dequeue',merke:'Stack = Stapel, Queue = Warteschlange.'},
{q:'AE 8: Was ist Pseudocode und warum nutzt man ihn?',a:'Pseudocode beschreibt einen Algorithmus in verständlicher, sprachunabhängiger Form. Er ist nicht an eine konkrete Programmiersprache gebunden.\n\nVorteile:\n- Logik steht im Vordergrund\n- leichter zu lesen als echter Code\n- gut für Prüfungen und Planung\n- unabhängig von Syntaxdetails\n\nWichtig sind klare Strukturen: WENN/DANN/SONST, FÜR, SOLANGE, Eingabe, Ausgabe und Variablen.',merke:'Pseudocode zeigt die Logik, nicht Syntax-Tricks.'},
{q:'AE 9: Was bedeutet Kapselung in OOP?',a:'Kapselung bedeutet, dass Daten und Methoden in einer Klasse zusammengefasst werden und der direkte Zugriff auf interne Daten eingeschränkt wird.\n\nAttribute werden oft private gesetzt und über Methoden kontrolliert verändert, z. B. getter und setter.\n\nVorteile:\n- Schutz vor falschem Zugriff\n- interne Umsetzung kann geändert werden\n- klare Schnittstellen\n- bessere Wartbarkeit',merke:'Kapselung schützt innere Daten durch klare Schnittstellen.'},
{q:'AE 10: Was ist der Unterschied zwischen Syntaxfehler und Logikfehler?',a:'Syntaxfehler:\nDer Code verstößt gegen Sprachregeln, z. B. fehlende Klammer oder falsches Schlüsselwort. Das Programm startet oft gar nicht.\n\nLogikfehler:\nDer Code ist formal gültig, liefert aber ein falsches Ergebnis. Beispiel: Rabatt wird addiert statt abgezogen.\n\nLogikfehler sind oft schwerer zu finden, weil das Programm trotzdem läuft.',merke:'Syntax kaputt = läuft nicht. Logik kaputt = läuft falsch.'}
];
